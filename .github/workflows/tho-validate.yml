name: THO validate personal Boost

on:
  workflow_dispatch:
  push:
    branches: [tho/main]

permissions:
  contents: read

concurrency:
  group: tho-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this personal commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install matching Android SDK components
        run: |
          printf 'y\n%.0s' {1..20} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test and build personal debug APK
        run: |
          chmod +x gradlew
          ./gradlew :plugins:aps:testAndroidHostTest :plugins:constraints:testAndroidHostTest :core:keys:testAndroidHostTest :app:assembleFullDebug --no-parallel --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Xss4m' '-Pkotlin.daemon.jvmargs=-Xmx2g' --console=plain
      - name: Identify artifact
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for module in ('plugins/aps', 'plugins/constraints', 'core/keys'):
              suites = [ET.parse(p).getroot() for p in glob.glob(f'{module}/build/test-results/testAndroidHostTest/TEST-*.xml')]
              count = sum(int(s.get('tests', 0)) for s in suites)
              failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
              assert count > 0 and failures == 0, (module, count, failures)
              print(f'{module}: {count} tests, {failures} failures/errors')
          PY
          git rev-parse HEAD > tho-build-commit.txt
          sha256sum app/build/outputs/apk/full/debug/*.apk > tho-apk-sha256.txt
      - name: Keep APK and test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tho-debug-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/full/debug/*.apk
            plugins/aps/build/test-results/testAndroidHostTest/*.xml
            plugins/constraints/build/test-results/testAndroidHostTest/*.xml
            core/keys/build/test-results/testAndroidHostTest/*.xml
            tho-build-commit.txt
            tho-apk-sha256.txt
